# wrangler.toml

name = "solar-quote-app"
compatibility_date = "2024-01-01"

# Thuộc tính này có thể giữ ở cấp cao nhất
pages_build_output_dir = "public"

[vars]
NODE_ENV = "production"

# Đặt các cấu hình dành riêng cho Pages vào trong mục [pages]
[pages]
  # Di chuyển lệnh build vào đây và đổi tên thành 'command'
  command = "npm run build"

  # Cấu hình functions cũng nên nằm trong [pages]
  [pages.functions]
    directory = "./functions"
    compatibility_date = "2024-01-01"
    compatibility_flags = ["nodejs_compat"]

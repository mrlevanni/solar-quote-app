# Cấu hình chính
name = "solar-quote-app"
compatibility_date = "2024-01-01"

# Cấu hình build ở cấp cao nhất
pages_build_command = "npm run build"
pages_build_output_dir = "public"

# Biến môi trường
[vars]
NODE_ENV = "production"

# Cấu hình Functions ở cấp cao nhất
[functions]
directory = "functions"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Cấu hình D1 Databases (nếu cần)
# [[d1_databases]]
# binding = "DB"
# database_name = "solar-quote-db"
# database_id = "your-database-id"
